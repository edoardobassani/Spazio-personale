<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111715" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Il tuo spazio personale per impegni, progetti e interessi.">
  <title>Spazio personale</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Se qualcosa si rompe, lo mostro a schermo invece di lasciare l'app muta
    window.addEventListener('error', function (e) {
      var b = document.getElementById('boot-error');
      if (!b) return;
      b.hidden = false;
      b.querySelector('code').textContent = (e.message || 'Errore sconosciuto') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
    });
  </script>
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="brand" href="#oggi"><img src="icon.svg" alt="" width="28" height="28">Spazio</a>
      <button class="icon-btn" data-action="open-settings" aria-label="Impostazioni">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </header>

    <div id="boot-error" class="boot-error" hidden>
      <strong>Qualcosa non ha funzionato.</strong>
      <p>Prova a chiudere e riaprire l'app. Se il problema resta, comunica questo messaggio:</p>
      <code></code>
    </div>
    <noscript><div class="boot-error"><strong>Serve JavaScript</strong><p>Attiva JavaScript nel browser per usare l'app.</p></div></noscript>

    <main id="main"><p class="loading">Caricamento…</p></main>

    <nav class="tabs" aria-label="Sezioni">
      <a href="#oggi" data-route="oggi"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Oggi</span></a>
      <a href="#impegni" data-route="impegni"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Impegni</span></a>
      <a href="#interessi" data-route="interessi"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15.2 8.8l-1.9 4.5-4.5 1.9 1.9-4.5z"/></svg><span>Interessi</span></a>
      <a href="#progetti" data-route="progetti"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l8.5 4.7L12 13 3.5 8.2z"/><path d="M3.5 12.3L12 17l8.5-4.7"/><path d="M3.5 16.2L12 21l8.5-4.8"/></svg><span>Progetti</span></a>
      <a href="#assistente" data-route="assistente"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.8 5.2 5.2 1.8-5.2 1.8L12 17.5l-1.8-5.2-5.2-1.8 5.2-1.8z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg><span>Assistente</span></a>
    </nav>
  </div>

  <dialog id="sheet" class="sheet" aria-modal="true"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
